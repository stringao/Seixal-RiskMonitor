services:
  georisk-db:
    image: postgis/postgis:17-3.5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: georisk
      POSTGRES_USER: georisk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-georisk_dev_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georisk"]
      interval: 5s
      retries: 5

  georisk-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  georisk-api:
    build:
      context: .
      dockerfile: src/GeoRisk.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=georisk-db;Database=georisk;Username=georisk;Password=${DB_PASSWORD:-georisk_dev_2024}
      - Redis__ConnectionString=georisk-redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
      - LLM__Provider=${LLM_PROVIDER:-Ollama}
      - DeepSeek__ApiKey=${DEEPSEEK_API_KEY:-}
      - DeepSeek__Model=${DEEPSEEK_MODEL:-deepseek-chat}
      - Ollama__BaseUrl=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - Ollama__Model=${OLLAMA_MODEL:-qwen3:8b}
      - Qwen__ApiKey=${QWEN_API_KEY:-}
      - Qwen__Model=${QWEN_MODEL:-qwen-turbo}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - GEORISK_SRTM_DIR=/app/srtm_processed
    volumes:
      - ./srtm_processed:/app/srtm_processed:ro
    depends_on:
      georisk-db:
        condition: service_healthy
      georisk-redis:
        condition: service_healthy

  georisk-web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_OSRM_URL=http://localhost:5001
    depends_on:
      georisk-api:
        condition: service_started

  georisk-sonarqube:
    image: sonarqube:community
    ports:
      - "9001:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://georisk-sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_pass}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      georisk-sonarqube-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 15s
      retries: 10
      start_period: 60s

  georisk-sonarqube-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_pass}
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      retries: 5

  # OSRM - Open Source Routing Machine (self-hosted)
  # Uses OpenStreetMap data for real road routing
  # IMPORTANT: Run scripts/setup-osrm-data.sh first to download and process Portugal OSM data
  georisk-osrm:
    image: osrm/osrm-backend
    ports:
      - "5001:5000"
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/portugal-latest.osrm
    volumes:
      - ./docker/osrm-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/routes?coordinates=-9.1,38.7;-9.0,38.6 || exit 1"]
      interval: 30s
      retries: 3
      start_period: 2m

  # Ollama - Self-hosted LLM (Qwen, Llama, Mistral, etc)
  # No API key needed - runs locally with GPU support
  georisk-ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai

volumes:
  pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
  ollama_data:
